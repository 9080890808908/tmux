name: sync-upstream
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote add upstream https://github.com/tmux/tmux.git
          git fetch upstream master --tags
          if git merge-base --is-ancestor upstream/master HEAD; then exit 0; fi
          git merge --no-edit upstream/master
          git push origin HEAD:master --tags
          gh workflow run appimage.yml --ref master
