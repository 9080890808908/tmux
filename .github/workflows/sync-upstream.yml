name: sync-upstream
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          tag=$(git ls-remote --tags --refs https://github.com/tmux/tmux.git | awk '{sub("refs/tags/","",$2);print $2}' | grep -E '^[0-9]+\.[0-9]+[a-z]?$' | sort -V | tail -1)
          [ -n "$tag" ] || exit 1
          gh release view "$tag" >/dev/null 2>&1 && exit 0
          gh workflow run appimage.yml -f tag="$tag"
