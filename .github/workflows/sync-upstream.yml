name: sync-upstream
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git clone --bare --filter=blob:none https://github.com/tmux/tmux.git /tmp/up
          sha=$(git -C /tmp/up rev-parse master)
          [ "$sha" = "$(cat .upstream-sha 2>/dev/null)" ] && exit 0
          ver=$(git -C /tmp/up describe --tags --always master)
          git ls-files | grep -v -e '^\.github/' -e '^packaging/appimage/' | xargs git rm -q
          git -C /tmp/up archive master | tar -x --exclude=.github
          echo "$sha" > .upstream-sha
          echo "$ver" > .upstream-version
          git add -A
          git commit -qm "Sync upstream $ver"
          git push origin HEAD:master
          gh workflow run appimage.yml --ref master
