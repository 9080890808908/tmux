name: appimage
on:
  workflow_dispatch:
    inputs:
      tag:
        description: upstream tmux tag
        required: true
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: docker.io/rockylinux/rockylinux:8.10
    steps:
      - name: Install toolchain
        run: |
          dnf -y install epel-release dnf-plugins-core
          dnf config-manager --set-enabled powertools
          dnf -y install gcc make automake autoconf bison flex pkgconf-pkg-config git curl file xz tar gzip patch squashfs-tools desktop-file-utils
      - uses: actions/checkout@v4
        with:
          repository: tmux/tmux
          ref: ${{ inputs.tag }}
      - uses: actions/checkout@v4
        with:
          path: ci
      - run: cp -r ci/packaging .
      - run: packaging/appimage/build.sh
        env:
          TMUX_VERSION: ${{ inputs.tag }}
      - name: Smoke test
        run: |
          ./tmux-*-${{ matrix.arch }}.AppImage --appimage-extract-and-run -V
          TERM=xterm-256color ./tmux-*-${{ matrix.arch }}.AppImage --appimage-extract-and-run -f /dev/null new-session -d 'sleep 1' \; list-sessions
      - uses: actions/upload-artifact@v4
        with:
          name: tmux-${{ matrix.arch }}
          path: tmux-*.AppImage
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=${{ inputs.tag }}
          for f in dist/*.AppImage; do
            arch=$(echo "$f" | sed 's/.*-\([a-z0-9_]*\)\.AppImage/\1/')
            mv "$f" "dist/tmux-$arch.AppImage"
          done
          gh release create "$tag" --title "tmux $tag" --notes "AppImage build of upstream tmux $tag" --target master dist/tmux-x86_64.AppImage dist/tmux-aarch64.AppImage
